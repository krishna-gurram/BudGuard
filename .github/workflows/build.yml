name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No Gradle cache: it counts against the free 0.5 GB Actions storage.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true

      - name: Unit tests
        run: gradle :app:testReleaseUnitTest --stacktrace

      - name: Build signed APK
        run: gradle :app:assembleRelease --stacktrace

      # Renders key screens to PNGs (attached to the release) so the design can be reviewed
      # without a phone. Never blocks the APK.
      - name: Screenshots
        continue-on-error: true
        run: |
          gradle :app:testReleaseUnitTest -Pshots --tests '*ScreenshotShots*' --stacktrace
          mkdir -p out && cd app/build/shots && zip -q ../../../out/screenshots.zip *.png

      - name: Name the APK
        run: |
          base=$(grep -oP 'versionName = "\K[0-9]+\.[0-9]+' app/build.gradle.kts | head -1)
          echo "VERSION=$base.${{ github.run_number }}" >> "$GITHUB_ENV"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/BudGuard-v$base.${{ github.run_number }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: BudGuard v${{ env.VERSION }}
          prerelease: true
          files: |
            out/*.apk
            out/screenshots.zip
          body: Install on the Fold, then open Diagnostics and tap Copy report.
